name: Deploy to Hostinger

# Manual until the Hostinger account is set up (see backend/README.md,
# "Deploy to Hostinger"). To deploy on every push instead, add:
#   push:
#     branches: ["main"]
on:
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SITE_URL: ${{ vars.HOSTINGER_SITE_URL }}   # e.g. https://www.example.com/
      API_URL: /api
      DEMO_MODE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build the site
        run: |
          test -n "$SITE_URL" || { echo "Set the HOSTINGER_SITE_URL repository variable."; exit 1; }
          npm ci
          npm run build
          npm run verify:export
          cp deploy/hostinger/htaccess-public_html out/.htaccess

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Update the API (git pull, composer, migrations)
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APP_DIR: ${{ vars.HOSTINGER_APP_DIR }}          # e.g. domains/example.com/app
        run: |
          ssh -i ~/.ssh/hostinger -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$APP_DIR' && git pull --ff-only && bash deploy/hostinger/deploy.sh"

      - name: Upload the site
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          PUBLIC_DIR: ${{ vars.HOSTINGER_PUBLIC_DIR }}    # e.g. domains/example.com/public_html
        run: |
          # --delete removes pages that no longer exist; the Laravel symlink is protected.
          rsync -rlz --delete --filter='P laravel' \
            -e "ssh -i ~/.ssh/hostinger -p $SSH_PORT" \
            out/ "$SSH_USER@$SSH_HOST:$PUBLIC_DIR/"

      - name: Check the API
        run: curl -fsS "${SITE_URL%/}/api/health"
